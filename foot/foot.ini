# Match ghostty/config: Iosevka NFM, 16 pt, Gruvbox Dark.
# Bold and italic faces are selected automatically.
# Foot does not support Ghostty's multi-character calt/liga/dlig ligatures.
font=Iosevka NFM:size=16
dpi-aware=no
font-size-adjustment=1

# Ghostty's 2 pt padding is approximately 3 logical pixels at 96 DPI.
pad=3x3
resize-by-cells=no
resize-keep-grid=no
selection-target=primary
bold-text-in-bright=no

[scrollback]
# Foot counts lines; Ghostty's default limit is 10 MB, so this is approximate.
lines=10000
multiplier=3
indicator-position=none

[cursor]
style=block
blink=yes

[colors]
# Exact colors from Ghostty's bundled "Gruvbox Dark" theme.
background=282828
foreground=ebdbb2
cursor=282828 ebdbb2
selection-background=665c54
selection-foreground=ebdbb2

regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

[key-bindings]
# Copy/paste, zoom, page scrolling, and new-window defaults already match.
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
search-start=Control+Shift+f
scrollback-home=Shift+Home
scrollback-end=Shift+End
prompt-prev=Control+Shift+Page_Up
prompt-next=Control+Shift+Page_Down
fullscreen=Control+Return

[mouse-bindings]
# Ghostty selects a full line on triple-click.
select-quote=none
select-row=BTN_LEFT-3
