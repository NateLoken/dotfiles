general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor = 
    path = $HOME/Pictures/walls/abstract_lines.png
    blur_passes = 4
    blur_size = 6
    noise = 0.003
    contrast = 1.00
    brightness = 0.88
    vibrancy = 0.05
    vibrancy_darkness = 0.14
}

input-field {
    monitor = 
    size = 312, 56
    position = 0, -30
    halign = center
    valign = center
    fade_on_empty = false
    placeholder_text =  AUTHENTICATE
    fail_text =  ACCESS DENIED
    dots_size = 0.24
    dots_spacing = 0.22
    dots_center = true
    rounding = 28
    outline_thickness = 4
    inner_color = rgba(48,52,76,0.64)
    outer_color = rgba(228,232,236,0.98)
    check_color = rgba(238,192,92,0.92)
    fail_color = rgba(228,80,72,0.92)
    capslock_color = rgba(228,80,72,0.95)
    font_color = rgba(236,240,238,0.98)
    font_family = monospace
}

